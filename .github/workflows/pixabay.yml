name: Fetch Pixabay photos

on:
  push:
    branches: [main]
    paths: ["queue/px_*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixabay
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search Pixabay and save photos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 tools/fetch.py
      - name: Save the photos to the repo
        run: |
          git config user.name "pixabay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pixabay queue
          git diff --cached --quiet && exit 0
          git commit -q -m "Pixabay photos"
          git pull -q --rebase origin main
          git push -q
